<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#12131c"/>
      <stop offset="100%" stop-color="#1a0d18"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#ffdd00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes skipFloat {
      0% { transform: translateX(0px); }
      50% { transform: translateX(12px); }
      100% { transform: translateX(0px); }
    }
    @keyframes radarSweep {
      0% { stroke-dashoffset: 0; opacity: 0.8; }
      50% { stroke-dashoffset: 120; opacity: 0.3; }
      100% { stroke-dashoffset: 240; opacity: 0.8; }
    }
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes adBlockZap {
      0% { opacity: 1; transform: scale(1); }
      40% { opacity: 0.2; transform: scale(0.95); }
      60% { opacity: 0.1; }
      80% { opacity: 1; transform: scale(1); }
    }
    .bg-grid {
      stroke: #ffffff;
      stroke-opacity: 0.04;
      stroke-width: 1;
    }
    .pulse-layer {
      animation: pulseGlow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .skip-anim {
      animation: skipFloat 2.2s ease-in-out infinite;
    }
    .badge-anim {
      animation: badgeBounce 3s ease-in-out infinite;
    }
    .zap-anim {
      animation: adBlockZap 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>

  <!-- Subtle Cyber Grid -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Background Ambient Glows -->
  <circle cx="250" cy="180" r="130" fill="#ff0033" opacity="0.18" filter="url(#softGlow)" class="pulse-layer"/>
  <circle cx="950" cy="220" r="160" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)" class="pulse-layer"/>

  <!-- Left Side: YouTube / Ad Block Visual Showcase -->
  <g transform="translate(90, 80)">
    <!-- Video Player Mockup Frame -->
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#141622" stroke="#2a2e45" stroke-width="2"/>
    
    <!-- Top Bar with status dots -->
    <rect x="0" y="0" width="340" height="30" rx="12" fill="#1d2030"/>
    <circle cx="18" cy="15" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="15" r="4.5" fill="#ffbd2e"/>
    <circle cx="50" cy="15" r="4.5" fill="#27c93f"/>
    <text x="170" y="19" fill="#717a9c" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="600">youtube.com/watch</text>

    <!-- Ad Overlay Container that gets "Skipped/Zapped" -->
    <g class="zap-anim" transform="translate(20, 50)">
      <rect x="0" y="0" width="300" height="110" rx="8" fill="#1f1418" stroke="#ff0033" stroke-width="1.5" stroke-dasharray="4 2"/>
      <rect x="15" y="15" width="40" height="20" rx="4" fill="url(#goldGrad)"/>
      <text x="35" y="29" fill="#000" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">Ad</text>
      <text x="65" y="30" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Video Ad Playing (0:15)</text>
      
      <!-- Strikethrough line to represent instant bypass -->
      <line x1="65" y1="26" x2="225" y2="26" stroke="#ff0033" stroke-width="2.5"/>
      <text x="15" y="55" fill="#a0a5ba" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Bypassing interruptions automatically...</text>

      <!-- Skip Button Emulation -->
      <g transform="translate(160, 65)">
        <rect x="0" y="0" width="125" height="32" rx="6" fill="#ff0033" filter="url(#glow)"/>
        <text x="48" y="21" fill="#ffffff" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Skip Ad</text>
        <!-- Fast Forward Arrows -->
        <path d="M96 11 L106 16 L96 21 Z" fill="#ffffff"/>
        <path d="M106 11 L116 16 L106 21 Z" fill="#ffffff"/>
        <line x1="116" y1="11" x2="116" y2="21" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>

    <!-- Auto-Skip Active Notification Pill -->
    <g transform="translate(20, 180)" class="skip-anim">
      <rect x="0" y="0" width="300" height="36" rx="8" fill="#10271c" stroke="#27c93f" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="5" fill="#27c93f" filter="url(#glow)"/>
      <text x="36" y="22" fill="#5af782" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">⚡ Fast Auto-Skip: 0ms Latency</text>
    </g>
  </g>

  <!-- Right Side: Brand & Feature Highlights -->
  <g transform="translate(500, 75)">
    <!-- Badge -->
    <g class="badge-anim">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#20152b" stroke="#7928ca" stroke-width="1"/>
      <text x="110" y="18" fill="#c471ed" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">✨ ULTRA-FAST CHROME EXTENSION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="#ffffff" font-size="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="-0.5">
      YouTube Ad <tspan fill="url(#redGrad)">Skipper</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#a5abbf" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400">
      Instant ad-skipping, smart auto-mute, &amp; creator-friendly whitelisting.
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 140)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#00f2fe" font-size="14">⏩</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Instant Auto-Skip</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#ff4b2b" font-size="14">🔇</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Smart Auto-Mute</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#27c93f" font-size="14">🤍</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Creator Whitelist</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 52)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#c471ed" font-size="14">🌙</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Dark / Light Themes</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(195, 52)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#ffbb00" font-size="14">🔒</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">100% Client-Side</text>
      </g>

      <!-- Item 6 -->
      <g transform="translate(390, 52)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#181a28" stroke="#252940" stroke-width="1"/>
        <text x="16" y="26" fill="#5af782" font-size="14">⚡</text>
        <text x="42" y="26" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Zero Lag / Bloat</text>
      </g>
    </g>
  </g>
</svg>
